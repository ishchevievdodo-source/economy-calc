        if(page==='plans'){$('#goalForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.goals.push({id:uid(),name:f.get('name'),target:Number(f.get('target')),saved:0,deadline:String(f.get('deadline')||data.weddingDate),emoji:'🎯'});save();render()};$('#taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.tasks.push({id:uid(),title:String(f.get('title')),due:String(f.get('due')||''),link:String(f.get('link')||''),note:String(f.get('note')||''),done:false});save();render();toast('Дело добавлено')};$('#purchaseForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.purchases.push({id:uid(),name:f.get('name'),amount:Number(f.get('amount')),due:data.weddingDate,priority:'Желательно',done:false,link:String(f.get('link')||'')});save();render()}}
        if(page==='calendar'){$('#prevMonth').onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1);selectedDate=localIso(new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1));render()};$('#nextMonth').onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1);selectedDate=localIso(new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1));render()};document.querySelectorAll('[data-cal-date]').forEach(x=>x.onclick=()=>{selectedDate=x.dataset.calDate;render()});document.querySelector('[data-add-date]').onclick=e=>openTransaction(e.currentTarget.dataset.addDate)}
        if(page==='tours'){$('#tourSettingsForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),min=Number(f.get('nightsMin')),max=Number(f.get('nightsMax'));if(max<min){alert('Максимальное количество ночей не может быть меньше минимального.');return}data.tourSearch={...data.tourSearch,city:String(f.get('city')).trim(),departureDate:String(f.get('departureDate')),nightsMin:min,nightsMax:max,adults:Number(f.get('adults'))};save();render();toast('Параметры поездки сохранены')};$('#tourPriceForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),entry={id:uid(),checkedAt:String(f.get('checkedAt')),destination:String(f.get('destination')),source:String(f.get('source')).trim(),price:Number(f.get('price')),hotel:String(f.get('hotel')).trim(),url:String(f.get('url')).trim(),note:String(f.get('note')).trim(),addedAt:new Date().toISOString()};if(!entry.checkedAt||!entry.source||!entry.price)return;data.tourPrices.push(entry);save();render();toast('Цена добавлена в историю')};$('#copyTourFilter').onclick=()=>{const text=tourFilterText();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Фильтр скопирован')).catch(()=>prompt('Скопируйте параметры поиска:',text));else prompt('Скопируйте параметры поиска:',text)}}
        if(page==='meals'){$('#groceryForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.grocery.push({id:uid(),name:f.get('name'),qty:f.get('qty'),checked:false});save();render();toast('Покупка добавлена')}}
        if(page==='settings'){$('#weddingDate').onchange=e=>{data.weddingDate=e.target.value;save()};$('#reportingStart').onchange=e=>{data.reportingStart=e.target.value||'2026-12-01';if(reportMonth<startMonth())reportMonth=startMonth();save()};$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();$('#resetBtn').onclick=()=>{if(confirm('Удалить все данные, включая общую серверную копию, и вернуть пример?')){data=fresh();reportMonth=startMonth();save();render();toast('Данные сброшены')}};const createForm=$('#createFamilyForm'),joinForm=$('#joinFamilyForm');if(createForm)createForm.onsubmit=e=>{e.preventDefault();createFamily(String(new FormData(e.target).get('name')||''))};if(joinForm)joinForm.onsubmit=e=>{e.preventDefault();joinFamily(String(new FormData(e.target).get('code')||''))}}
      }
      document.addEventListener('change',e=>{const t=e.target;if(t.dataset.goalDeadline){const goal=data.goals.find(x=>x.id===t.dataset.goalDeadline);if(goal&&t.value){goal.deadline=t.value;save();render();toast('Срок цели обновлён')}return}if(t.dataset.goal){const x=data.goals.find(x=>x.id===t.dataset.goal);x[t.dataset.field]=Number(t.value);save();render()}if(t.dataset.task){const x=data.tasks.find(x=>x.id===t.dataset.task);x[t.dataset.field]=t.dataset.field==='done'?t.checked:t.value;save();render()}if(t.dataset.purchase){const x=data.purchases.find(x=>x.id===t.dataset.purchase);x[t.dataset.field]=t.dataset.field==='done'?t.checked:t.dataset.field==='amount'?Number(t.value):t.value;save();render()}if(t.dataset.budget){data.budget.find(x=>x.id===t.dataset.budget).planned=Number(t.value);save();render()}if(t.dataset.meal){const meal=data.meals[Number(t.dataset.meal)];if(t.dataset.field==='dishId'){const dish=dishes.find(x=>x.id===t.value);meal.dishId=t.value;meal.dish=dish?.name||meal.dish;meal.cost=dish?.cost||meal.cost}else meal[t.dataset.field]=t.dataset.field==='cost'?Number(t.value):t.value;save();render()}if(t.dataset.grocery){data.grocery.find(x=>x.id===t.dataset.grocery).checked=t.checked;save();render()}if(t.dataset.recipeCheck){data.recipeChecks[t.dataset.recipeCheck]=t.checked;save();render()}});
      document.addEventListener('input',e=>{const t=e.target;if(t.dataset.meal&&t.dataset.field==='dish'){const meal=data.meals[Number(t.dataset.meal)];meal.dish=t.value;meal.dishId='';save()}});
      document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.removeGoal){data.goals=data.goals.filter(x=>x.id!==b.dataset.removeGoal);save();render()}if(b.dataset.removeTask){data.tasks=data.tasks.filter(x=>x.id!==b.dataset.removeTask);save();render()}if(b.dataset.removePurchase){data.purchases=data.purchases.filter(x=>x.id!==b.dataset.removePurchase);save();render()}if(b.dataset.removeTx){data.transactions=data.transactions.filter(x=>x.id!==b.dataset.removeTx);save();render()}if(b.dataset.removeGrocery){e.preventDefault();data.grocery=data.grocery.filter(x=>x.id!==b.dataset.removeGrocery);save();render()}if(b.dataset.removeTourPrice){data.tourPrices=data.tourPrices.filter(x=>x.id!==b.dataset.removeTourPrice);save();render();toast('Цена удалена')}});
      function openTransaction(date=localIso(new Date())){$('#txForm').reset();txType='expense';txReturnPage=page;$('#txDate').value=date;updateTxModal();$('#txModal').classList.remove('hidden');setTimeout(()=>$('#txForm [name=amount]').focus(),50)}
      $('#addTx').onclick=()=>openTransaction();document.querySelector('[data-close]').onclick=()=>$('#txModal').classList.add('hidden');$('#txModal').onclick=e=>{if(e.target===$('#txModal'))$('#txModal').classList.add('hidden')};$('#txTypes').onclick=e=>{const b=e.target.closest('[data-type]');if(b){txType=b.dataset.type;updateTxModal()}};
      function baseSalary(date){const prefix=(date||localIso(new Date())).slice(0,7),salaries=data.transactions.filter(x=>x.type==='income'&&x.category==='Основная зарплата'),current=salaries.find(x=>x.date.startsWith(prefix));return (current||salaries[0])?.amount||0}
      function updateIncomeFields(){const isBonus=txType==='income'&&['Премия','Доп. премия'].includes($('#txCategory').value),percent=isBonus&&$('#bonusMode').value==='percent',salary=baseSalary($('#txDate').value);$('#bonusBox').classList.toggle('hidden',!isBonus);$('#percentField').classList.toggle('hidden',!percent);$('#txAmount').readOnly=percent;if(percent){const pct=Number($('#bonusPercent').value)||0;$('#txAmount').value=salary&&pct?Math.round(salary*pct/100):'';$('#bonusHint').textContent=salary?`Основная ЗП: ${money(salary)} · премия: ${money($('#txAmount').value)}`:'Сначала добавьте основную зарплату, затем укажите процент.'}else if(isBonus){$('#bonusHint').textContent='Введите премию отдельной суммой.'}$('#txNote').placeholder=txType==='income'?'Например: квартальная премия или название подработки':'На что или откуда деньги';$('#noteCaption').textContent=txType==='income'?'Название или комментарий':'Комментарий'}
      function updateTxModal(){document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===txType));const select=$('#txCategory');select.innerHTML=txType==='saving'?data.goals.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''):txType==='income'?['Основная зарплата','Премия','Доп. премия','Доп. заработок','Другой доход'].map(x=>`<option>${x}</option>`).join(''):data.budget.map(x=>`<option>${esc(x.name)}</option>`).join('')+'<option>Другое</option>';updateIncomeFields()}
      $('#txCategory').onchange=updateIncomeFields;$('#bonusMode').onchange=updateIncomeFields;$('#bonusPercent').oninput=updateIncomeFields;$('#txDate').onchange=updateIncomeFields;
      $('#txForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount')),date=String(f.get('date')||''),selected=f.get('category'),goal=data.goals.find(x=>x.id===selected),category=goal?goal.name:selected,bonusPercent=txType==='income'&&$('#bonusMode').value==='percent'?Number($('#bonusPercent').value)||0:0;if(!date){alert('Выберите дату операции.');return}if(!amount){alert('Укажите сумму. Для процентной премии сначала добавьте основную зарплату.');return}if(txType==='saving'&&goal)goal.saved+=amount;const transaction={id:uid(),type:txType,amount,category,note:String(f.get('note')||''),bonusPercent,date};data.transactions=[transaction,...data.transactions];selectedDate=date;calendarCursor=new Date(date+'T12:00:00');save();e.target.reset();$('#txModal').classList.add('hidden');page=txReturnPage==='calendar'?'calendar':'budget';render();toast(`${txType==='income'?'Доход':'Операция'} ${money(amount)} ${txType==='income'?'сохранён':'сохранена'}`)};
      function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='budget-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Резервная копия скачана')}
      $('#importFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const next=JSON.parse(reader.result);if(!next.goals||!next.budget||!next.transactions)throw Error();data=next;normalize();reportMonth=currentMonth<startMonth()?startMonth():currentMonth;save();render();toast('Копия загружена')}catch{alert('Файл не похож на резервную копию приложения')}};reader.readAsText(file);e.target.value=''};
      render();
      loadCloud();
      setInterval(pollCloud,4000);
    })();
  </script>
